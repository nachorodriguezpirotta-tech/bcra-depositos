name: bcra-depositos-usd

# Disparo PRINCIPAL: launchd en la Mac de Ignacio hace `gh workflow run` a las
# 11:56 ART (los runs por workflow_dispatch arrancan en segundos, sin la cola
# que atrasa horas a los `schedule`). El `schedule` queda solo de RESPALDO por
# si la Mac está apagada (puede salir más tarde, pero sale). El guard evita
# duplicados entre ambos.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar envío aunque ya se haya enviado hoy"
        type: boolean
        default: false
  schedule:
    - cron: "0 15 * * 1"    # 12:00 ART
    - cron: "30 15 * * 1"   # 12:30 ART (respaldo)
    - cron: "0 16 * * 1"    # 13:00 ART (respaldo)
    - cron: "0 17 * * 1"    # 14:00 ART (respaldo)

concurrency:
  group: bcra-depositos-weekly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Saltar si ya se envió hoy (evita duplicados)
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Envío forzado — no se aplica el guard."
            exit 0
          fi
          hoy=$(date -u +%Y-%m-%d)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=success&created=${hoy}..${hoy}" --jq '.workflow_runs | length')
          echo "Runs exitosos hoy: $n"
          if [ "$n" -gt 0 ]; then
            echo "Ya se envió hoy — este intento se salta."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - if: env.SKIP != '1'
        run: python -m playwright install --with-deps chromium

      - name: Generar dashboard y enviar mail
        if: env.SKIP != '1'
        env:
          MAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.MAIL_OAUTH_REFRESH_TOKEN }}
          MAIL_OAUTH_CLIENT_ID: ${{ secrets.MAIL_OAUTH_CLIENT_ID }}
          MAIL_OAUTH_CLIENT_SECRET: ${{ secrets.MAIL_OAUTH_CLIENT_SECRET }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 send_dashboard.py
