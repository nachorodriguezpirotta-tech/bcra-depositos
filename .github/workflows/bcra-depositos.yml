name: bcra-depositos-usd

on:
  schedule:
    # Objetivo: mail PUNTUAL a las 12:00 ART (15:00 UTC) los lunes.
    # El cron de GHA puede dispararse tarde, así que hay varios intentos con
    # ventaja desde las 10:30 ART. El primero que arranca ESPERA hasta las
    # 15:00 UTC exactas y envía. El guard evita duplicados.
    - cron: "30 13 * * 1"   # 10:30 ART
    - cron: "45 13 * * 1"   # 10:45 ART
    - cron: "0 14 * * 1"    # 11:00 ART
    - cron: "15 14 * * 1"   # 11:15 ART
    - cron: "30 14 * * 1"   # 11:30 ART
    - cron: "45 14 * * 1"   # 11:45 ART
    - cron: "5 15 * * 1"    # 12:05 ART (catch-up si se cayeron los anteriores)
    - cron: "20 15 * * 1"   # 12:20 ART (catch-up)
  workflow_dispatch: {}

concurrency:
  group: bcra-depositos-weekly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Saltar si otro intento ya envió hoy
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hoy=$(date -u +%Y-%m-%d)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bcra-depositos.yml/runs?event=schedule&status=success&created=${hoy}..${hoy}" --jq '.workflow_runs | length')
          echo "Envíos exitosos del cron hoy: $n"
          if [ "$n" -gt 0 ]; then
            echo "Ya se envió hoy — este intento se salta."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - if: env.SKIP != '1'
        run: python -m playwright install --with-deps chromium

      # Setup ya listo; recién acá se espera al horario exacto (12:00 ART = 15:00 UTC).
      - name: Esperar hasta las 15:00 UTC (12:00 ART) para salida puntual
        if: env.SKIP != '1' && github.event_name == 'schedule'
        run: |
          target=$(date -u -d "today 15:00" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Esperando $((target - now))s hasta las 15:00 UTC (12:00 ART)..."
            sleep $((target - now))
          else
            echo "Ya pasó el horario objetivo — envío inmediato."
          fi

      - name: Generar dashboard y enviar mail
        if: env.SKIP != '1'
        env:
          MAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.MAIL_OAUTH_REFRESH_TOKEN }}
          MAIL_OAUTH_CLIENT_ID: ${{ secrets.MAIL_OAUTH_CLIENT_ID }}
          MAIL_OAUTH_CLIENT_SECRET: ${{ secrets.MAIL_OAUTH_CLIENT_SECRET }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 send_dashboard.py
